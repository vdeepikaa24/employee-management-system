spring.application.name=employeemanagementsystem

spring.datasource.url=${DB_URL:jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.datasource.archive.url=${ARCHIVE_DB_URL:jdbc:h2:mem:archivedb;DB_CLOSE_DELAY=-1}
app.datasource.archive.username=${ARCHIVE_DB_USERNAME:sa}
app.datasource.archive.password=${ARCHIVE_DB_PASSWORD:${DB_PASSWORD:password}}
app.datasource.archive.driver-class-name=${ARCHIVE_DB_DRIVER:org.h2.Driver}
