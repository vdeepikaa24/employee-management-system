spring.application.name=employeemanagementsystem
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL:jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Deepii@24}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local development key only. Set AUTH_TOKEN_SECRET to a random secret of at least 32 characters.
app.security.jwt.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-before-deployment-123456789}
app.security.jwt.issuer=employee-management-system
app.security.jwt.expiration-minutes=60
app.security.bootstrap-admin.username=${ADMIN_USERNAME:admin@example.com}
app.security.bootstrap-admin.password=${ADMIN_PASSWORD:Deepii@24}

app.datasource.archive.url=${ARCHIVE_DB_URL:jdbc:h2:mem:archivedb;DB_CLOSE_DELAY=-1}
app.datasource.archive.username=${ARCHIVE_DB_USERNAME:sa}
app.datasource.archive.password=${ARCHIVE_DB_PASSWORD:${DB_PASSWORD:Deepii@24}}
app.datasource.archive.driver-class-name=${ARCHIVE_DB_DRIVER:org.h2.Driver}
